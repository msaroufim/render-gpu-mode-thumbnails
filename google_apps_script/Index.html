<!doctype html>
<html lang="en">
  <head>
    <base target="_top">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      :root { color-scheme: light; font-family: Arial, Helvetica, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; background: #fff; color: #111; }
      main { width: min(640px, calc(100% - 40px)); margin: 48px auto; }
      h1 { font-size: 32px; line-height: 1.2; letter-spacing: -.02em; margin: 0 0 8px; }
      .lede { font-size: 16px; line-height: 1.5; color: #555; margin: 0 0 36px; }
      form { border-top: 1px solid #ddd; padding-top: 28px; }
      label, legend { display: block; font-weight: 700; margin-bottom: 8px; }
      .field { margin-bottom: 24px; }
      input, textarea { width: 100%; border: 1px solid #aaa; border-radius: 4px; padding: 11px 12px; font: inherit; background: #fff; }
      input:focus, textarea:focus { outline: 2px solid #111; outline-offset: 1px; border-color: #111; }
      textarea { min-height: 150px; resize: vertical; }
      .speaker { border-top: 1px solid #ddd; padding: 24px 0 0; margin: 0 0 24px; }
      .speaker-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
      .speaker-head h2 { font-size: 20px; margin: 0; }
      .hint { font-size: 14px; line-height: 1.4; color: #666; margin-top: 7px; }
      .actions { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
      button { border: 1px solid #111; border-radius: 4px; background: #111; color: #fff; padding: 11px 16px; font: inherit; font-weight: 700; cursor: pointer; }
      button.secondary { background: #fff; color: #111; }
      button.remove { background: transparent; color: #7b241c; border-color: #b88d88; padding: 7px 10px; }
      button:disabled { opacity: .55; cursor: wait; }
      .consent { display: grid; grid-template-columns: 22px 1fr; gap: 10px; align-items: start; font-weight: 400; line-height: 1.4; }
      .consent input { width: 18px; height: 18px; margin: 2px 0 0; }
      .honeypot { position: absolute; left: -10000px; width: 1px; height: 1px; overflow: hidden; }
      #status { margin-top: 18px; min-height: 24px; font-weight: 700; }
      #status.success { color: #14622d; }
      #status.error { color: #9a281e; }
      @media (max-width: 560px) { main { margin: 28px auto; } }
    </style>
  </head>
  <body>
    <main>
      <h1>GPU MODE speaker intake</h1>
      <p class="lede">Submit your talk details and profile picture for the event listing and YouTube thumbnail.</p>

      <form id="intake-form">
        <div class="honeypot" aria-hidden="true">
          <label>Company website <input id="company-website" autocomplete="off" tabindex="-1"></label>
        </div>
        <div class="field">
          <label for="contact-email">Contact email</label>
          <input id="contact-email" type="email" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="talk-title">Talk title</label>
          <input id="talk-title" maxlength="180" required>
        </div>
        <div class="field">
          <label for="abstract">Abstract</label>
          <textarea id="abstract" maxlength="5000" required></textarea>
        </div>
        <div class="field">
          <label for="subtitle">Thumbnail subtitle or URL <span class="hint">(optional)</span></label>
          <input id="subtitle" maxlength="160" placeholder="example.com/event">
        </div>

        <div id="speakers"></div>
        <div class="actions field">
          <button type="button" id="add-speaker" class="secondary">Add co-speaker</button>
        </div>

        <div class="field">
          <label class="consent">
            <input id="consent" type="checkbox" required>
            <span>I confirm that GPU MODE may use the submitted names, talk information, and profile pictures in public event materials and thumbnails.</span>
          </label>
          <p class="hint">Your submission and image files are stored in GPU MODE’s private Google Drive. Other speakers cannot view them.</p>
        </div>
        <button id="submit-button" type="submit">Submit talk</button>
        <div id="status" role="status" aria-live="polite"></div>
      </form>
    </main>

    <template id="speaker-template">
      <section class="speaker">
        <div class="speaker-head">
          <h2></h2>
          <button type="button" class="remove">Remove</button>
        </div>
        <div class="field">
          <label>Speaker name</label>
          <input class="speaker-name" maxlength="120" required>
        </div>
        <div class="field">
          <label>Profile picture</label>
          <input class="speaker-photo" type="file" accept="image/jpeg,image/png,image/webp" required>
          <p class="hint">JPEG, PNG, or WebP. Large photos are resized in your browser before upload.</p>
        </div>
      </section>
    </template>

    <script>
      const MAX_SPEAKERS = 3;
      const MAX_SOURCE_BYTES = 15 * 1024 * 1024;
      const MAX_OUTPUT_BYTES = 2 * 1024 * 1024;
      const PHOTO_TIMEOUT_MS = 45000;
      const SUBMISSION_TIMEOUT_MS = 90000;
      const SUPPORTED_IMAGE_TYPES = new Set([
        "image/jpeg",
        "image/jpg",
        "image/pjpeg",
        "image/png",
        "image/webp",
      ]);
      const speakersContainer = document.getElementById("speakers");
      const addButton = document.getElementById("add-speaker");
      const form = document.getElementById("intake-form");
      const submitButton = document.getElementById("submit-button");
      const statusElement = document.getElementById("status");

      function addSpeaker() {
        if (speakersContainer.children.length >= MAX_SPEAKERS) return;
        const fragment = document.getElementById("speaker-template").content.cloneNode(true);
        const section = fragment.querySelector(".speaker");
        const remove = fragment.querySelector(".remove");
        speakersContainer.appendChild(fragment);
        section.querySelector("h2").textContent = speakersContainer.children.length === 1
          ? "Speaker"
          : `Co-speaker ${speakersContainer.children.length - 1}`;
        remove.hidden = speakersContainer.children.length === 1;
        remove.addEventListener("click", () => {
          section.remove();
          renumberSpeakers();
        });
        addButton.disabled = speakersContainer.children.length >= MAX_SPEAKERS;
      }

      function renumberSpeakers() {
        [...speakersContainer.children].forEach((section, index) => {
          section.querySelector("h2").textContent = index === 0 ? "Speaker" : `Co-speaker ${index}`;
          section.querySelector(".remove").hidden = index === 0;
        });
        addButton.disabled = speakersContainer.children.length >= MAX_SPEAKERS;
      }

      function fileToResizedJpeg(file, speakerNumber) {
        if (!file) {
          return Promise.reject(new Error(`Choose a profile picture for speaker ${speakerNumber}.`));
        }
        if (file.size > MAX_SOURCE_BYTES) {
          return Promise.reject(new Error(`Speaker ${speakerNumber}'s picture must be smaller than 15 MB.`));
        }
        const mimeType = String(file.type || "").toLowerCase();
        if (mimeType && !SUPPORTED_IMAGE_TYPES.has(mimeType)) {
          return Promise.reject(new Error(
            `Speaker ${speakerNumber}'s picture is ${mimeType}. Please use a JPEG, PNG, or WebP file.`
          ));
        }

        return new Promise((resolve, reject) => {
          let settled = false;
          let objectUrl = "";
          const timeout = setTimeout(() => fail(new Error(
            `Speaker ${speakerNumber}'s picture took too long to prepare. Try a smaller JPEG or PNG.`
          )), PHOTO_TIMEOUT_MS);

          function cleanup() {
            clearTimeout(timeout);
            if (objectUrl) URL.revokeObjectURL(objectUrl);
          }

          function succeed(value) {
            if (settled) return;
            settled = true;
            cleanup();
            resolve(value);
          }

          function fail(error) {
            if (settled) return;
            settled = true;
            cleanup();
            reject(error);
          }

          function encode(blob) {
            if (!blob) {
              fail(new Error(`Could not prepare speaker ${speakerNumber}'s picture.`));
              return;
            }
            if (blob.size > MAX_OUTPUT_BYTES) {
              fail(new Error(`Speaker ${speakerNumber}'s picture is still too large after resizing.`));
              return;
            }
            const reader = new FileReader();
            reader.onerror = () => fail(new Error(`Could not read speaker ${speakerNumber}'s picture.`));
            reader.onload = () => {
              const parts = String(reader.result || "").split(",");
              if (parts.length < 2 || !parts[1]) {
                fail(new Error(`Could not encode speaker ${speakerNumber}'s picture.`));
                return;
              }
              const basename = file.name.replace(/\.[^.]+$/, "") || `speaker-${speakerNumber}`;
              succeed({
                filename: basename + ".jpg",
                mime_type: "image/jpeg",
                photo_base64: parts[1],
              });
            };
            reader.readAsDataURL(blob);
          }

          const image = new Image();
          image.onerror = () => fail(new Error(
            `Speaker ${speakerNumber}'s picture could not be opened. Please use a JPEG, PNG, or WebP file.`
          ));
          image.onload = () => {
            try {
              const maxDimension = 1200;
              const sourceWidth = image.naturalWidth || image.width;
              const sourceHeight = image.naturalHeight || image.height;
              if (!sourceWidth || !sourceHeight) {
                throw new Error("The image has no readable dimensions.");
              }
              const scale = Math.min(1, maxDimension / Math.max(sourceWidth, sourceHeight));
              const width = Math.max(1, Math.round(sourceWidth * scale));
              const height = Math.max(1, Math.round(sourceHeight * scale));
              const canvas = document.createElement("canvas");
              canvas.width = width;
              canvas.height = height;
              const context = canvas.getContext("2d");
              if (!context || typeof canvas.toBlob !== "function") {
                throw new Error("This browser cannot resize the selected picture.");
              }
              context.fillStyle = "#ffffff";
              context.fillRect(0, 0, width, height);
              context.drawImage(image, 0, 0, width, height);
              canvas.toBlob((blob) => {
                if (blob && blob.size <= MAX_OUTPUT_BYTES) {
                  encode(blob);
                  return;
                }
                canvas.toBlob(encode, "image/jpeg", 0.68);
              }, "image/jpeg", 0.82);
            } catch (error) {
              fail(new Error(`Could not prepare speaker ${speakerNumber}'s picture: ${error.message}`));
            }
          };
          try {
            objectUrl = URL.createObjectURL(file);
            image.src = objectUrl;
          } catch (error) {
            fail(new Error(`Could not open speaker ${speakerNumber}'s picture.`));
          }
        });
      }

      function submitPayload(payload) {
        return new Promise((resolve, reject) => {
          let settled = false;
          const timeout = setTimeout(() => {
            if (settled) return;
            settled = true;
            reject(new Error("The upload timed out. Check your connection and try again; your form entries are still here."));
          }, SUBMISSION_TIMEOUT_MS);

          function finish(callback, value) {
            if (settled) return;
            settled = true;
            clearTimeout(timeout);
            callback(value);
          }

          google.script.run
            .withSuccessHandler((result) => finish(resolve, result))
            .withFailureHandler((error) => finish(
              reject,
              new Error(error && error.message ? error.message : "Submission failed. Please try again.")
            ))
            .submitTalk(payload);
        });
      }

      function setBusy(isBusy) {
        submitButton.disabled = isBusy;
        submitButton.textContent = isBusy ? "Submitting…" : "Submit talk";
        addButton.disabled = isBusy || speakersContainer.children.length >= MAX_SPEAKERS;
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        statusElement.className = "";
        setBusy(true);
        try {
          if (!navigator.onLine) {
            throw new Error("You appear to be offline. Reconnect and try again.");
          }
          const speakers = [];
          const sections = [...speakersContainer.children];
          for (let index = 0; index < sections.length; index += 1) {
            statusElement.textContent = `Preparing photo ${index + 1} of ${sections.length}…`;
            const section = sections[index];
            const name = section.querySelector(".speaker-name").value.trim();
            const file = section.querySelector(".speaker-photo").files[0];
            const photo = await fileToResizedJpeg(file, index + 1);
            speakers.push({name, ...photo});
          }
          const payload = {
            contact_email: document.getElementById("contact-email").value.trim(),
            title: document.getElementById("talk-title").value.trim(),
            abstract: document.getElementById("abstract").value.trim(),
            subtitle: document.getElementById("subtitle").value.trim(),
            company_website: document.getElementById("company-website").value,
            consent: document.getElementById("consent").checked,
            speakers,
          };
          statusElement.textContent = "Uploading submission…";
          const result = await submitPayload(payload);
          form.reset();
          while (speakersContainer.children.length > 1) speakersContainer.lastElementChild.remove();
          renumberSpeakers();
          statusElement.className = "success";
          statusElement.textContent = `Submitted. Reference: ${result.submission_id}`;
          setBusy(false);
        } catch (error) {
          statusElement.className = "error";
          statusElement.textContent = error.message || "Submission failed. Please try again.";
          setBusy(false);
        }
      });

      addButton.addEventListener("click", addSpeaker);
      addSpeaker();
    </script>
  </body>
</html>
